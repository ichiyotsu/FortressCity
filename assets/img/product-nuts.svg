<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="七周年限定礼品 坚果礼盒套装">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#a8241f"/>
      <stop offset="0.6" stop-color="#8d1c1a"/>
      <stop offset="1" stop-color="#5d1211"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d8bd8e"/>
      <stop offset="1" stop-color="#b99a68"/>
    </linearGradient>
    <radialGradient id="bowl" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#cfc4b3"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="url(#felt)"/>
  <!-- paper bag -->
  <g transform="rotate(-6 190 170)">
    <path d="M150 96 L246 96 L252 268 L144 268 Z" fill="url(#kraft)"/>
    <path d="M150 96 L246 96 L244 112 L152 112 Z" fill="#c9ab7b"/>
    <path d="M178 96 Q178 66 198 66 Q218 66 218 96" fill="none" stroke="#8d6f45" stroke-width="3"/>
    <g fill="#3a2a18" opacity="0.85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">
      <text x="198" y="168" font-size="17" font-weight="700" letter-spacing="1">围城市政</text>
      <text x="198" y="184" font-size="7" letter-spacing="1.2">Fortress City Gov.</text>
      <rect x="166" y="192" width="64" height="1.6"/>
      <text x="198" y="206" font-size="6" letter-spacing="1">7th ANNIVERSARY</text>
    </g>
  </g>
  <!-- nut bowls -->
  <g>
    <ellipse cx="70" cy="228" rx="46" ry="24" fill="url(#bowl)"/>
    <ellipse cx="70" cy="224" rx="38" ry="17" fill="#7d5a33"/>
    <ellipse cx="70" cy="222" rx="34" ry="14" fill="#916a3d"/>
    <g fill="#c69a5f" opacity="0.9">
      <ellipse cx="56" cy="218" rx="5" ry="3" transform="rotate(-20 56 218)"/>
      <ellipse cx="70" cy="222" rx="5" ry="3" transform="rotate(12 70 222)"/>
      <ellipse cx="84" cy="217" rx="5" ry="3" transform="rotate(-8 84 217)"/>
      <ellipse cx="64" cy="228" rx="5" ry="3" transform="rotate(24 64 228)"/>
      <ellipse cx="80" cy="229" rx="5" ry="3" transform="rotate(-14 80 229)"/>
    </g>
    <ellipse cx="66" cy="282" rx="52" ry="26" fill="url(#bowl)"/>
    <ellipse cx="66" cy="277" rx="43" ry="19" fill="#8a5a2c"/>
    <ellipse cx="66" cy="275" rx="39" ry="16" fill="#a06d33"/>
    <g fill="#d0a764" opacity="0.85">
      <ellipse cx="50" cy="271" rx="4" ry="6" transform="rotate(18 50 271)"/>
      <ellipse cx="64" cy="277" rx="4" ry="6" transform="rotate(-10 64 277)"/>
      <ellipse cx="78" cy="270" rx="4" ry="6" transform="rotate(26 78 270)"/>
      <ellipse cx="70" cy="283" rx="4" ry="6" transform="rotate(-4 70 283)"/>
    </g>
  </g>
  <!-- flowers -->
  <g transform="translate(246 62)" opacity="0.95">
    <g fill="#f4d9e6">
      <ellipse cx="0" cy="-14" rx="7" ry="13"/>
      <ellipse cx="12" cy="0" rx="13" ry="7"/>
      <ellipse cx="0" cy="14" rx="7" ry="13"/>
      <ellipse cx="-12" cy="0" rx="13" ry="7"/>
    </g>
    <circle r="6" fill="#f3d27a"/>
  </g>
  <g transform="translate(272 116) scale(0.72)" opacity="0.9">
    <g fill="#ffffff">
      <ellipse cx="0" cy="-12" rx="6" ry="11"/>
      <ellipse cx="11" cy="0" rx="11" ry="6"/>
      <ellipse cx="0" cy="12" rx="6" ry="11"/>
      <ellipse cx="-11" cy="0" rx="11" ry="6"/>
    </g>
    <circle r="5" fill="#f3d27a"/>
