<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="白色八周年庆祝抱枕">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8a7364"/>
      <stop offset="0.55" stop-color="#6d594c"/>
      <stop offset="1" stop-color="#3d322b"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f4f1"/>
      <stop offset="1" stop-color="#dedad5"/>
    </linearGradient>
    <radialGradient id="lamp" cx="30%" cy="18%" r="60%">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="url(#room)"/>
  <rect width="320" height="320" fill="url(#lamp)"/>
  <!-- sofa arm -->
  <path d="M0 176 L58 168 L58 320 L0 320 Z" fill="#4a3d34" opacity="0.85"/>
  <path d="M240 190 L320 182 L320 320 L240 320 Z" fill="#5b4b40" opacity="0.9"/>
  <ellipse cx="160" cy="286" rx="118" ry="20" fill="#241d18" opacity="0.55"/>
  <!-- pillow -->
  <path d="M62 104 Q160 84 258 104 Q272 190 258 258 Q160 278 62 258 Q48 190 62 104 Z" fill="url(#cushion)"/>
  <path d="M70 112 Q160 94 250 112 Q262 190 250 250 Q160 268 70 250 Q58 190 70 112 Z" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.7"/>
  <!-- print -->
  <g fill="#4a4a4a">
    <rect x="92" y="146" width="66" height="4"/>
    <text x="125" y="196" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1.5">FCG</text>
    <text x="136" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.8">8th celebrate</text>
    <rect x="92" y="236" width="66" height="4"/>
  </g>
</svg>
