<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="SIXTH 六周年标识">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="55%">
      <stop offset="0" stop-color="#7b4bd8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4b2a86" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letters" x1="0.05" y1="0.9" x2="0.95" y2="0.1">
      <stop offset="0" stop-color="#5f7bf0"/>
      <stop offset="0.35" stop-color="#8f6cf0"/>
      <stop offset="0.7" stop-color="#c96ef0"/>
      <stop offset="1" stop-color="#f07bc8"/>
    </linearGradient>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="340" fill="#000"/>
  <ellipse cx="450" cy="180" rx="330" ry="120" fill="url(#halo)"/>
  <g filter="url(#softglow)">
    <text x="450" y="222" text-anchor="middle" fill="url(#letters)" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-2" transform="rotate(-3 450 170)">SIXTH</text>
  </g>
  <g opacity="0.55" fill="none" stroke="#c9a3f0" stroke-width="1.2">
    <path d="M240 268 Q450 300 660 262"/>
  </g>
</svg>
